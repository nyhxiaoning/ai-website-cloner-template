            - generic [ref=f3e74]: "1"
            - heading "首页先生成主图" [level=3] [ref=f3e75]
            - paragraph [ref=f3e76]: 注册赠送 4 credits，只覆盖 1 次主图生成。
            - paragraph [ref=f3e77]: 选风格、选主题，必要时加参考图或角色说明。首页现在只负责生成主表情图，成功后会自动进入切割页，不会在首页同步生成横幅、封面、图标。
          - article [ref=f3e78]:
            - generic [ref=f3e79]: "2"
            - heading "进入切割页筛掉不满意的图" [level=3] [ref=f3e80]
            - paragraph [ref=f3e81]: 微信专辑只要求 8-24 张，不需要硬留满 24 张。
            - paragraph [ref=f3e82]: 先看切图结果，把明显出错、压线或文字不满意的图删掉，只保留最稳的那一批。聊天自用时，做到这一步就已经够用了。
          - article [ref=f3e83]:
            - generic [ref=f3e84]: "3"
            - heading "按需补齐上架素材" [level=3] [ref=f3e85]
            - paragraph [ref=f3e86]: 只有要上架微信平台时，才需要充值后继续生成素材。
            - paragraph [ref=f3e87]: 上架必须：横幅、封面、图标。开赞赏还需要赞赏引导图、致谢图，以及艺术家头像和主页横幅（在艺术家资料页生成，账号级只需做一次）。这些素材按张扣 credits，失败自动退回。
          - article [ref=f3e88]:
            - generic [ref=f3e89]: "4"
            - heading "按用途下载" [level=3] [ref=f3e90]
            - paragraph [ref=f3e91]: 聊天用和上架用，下载入口不一样。
            - paragraph [ref=f3e92]: 只想在微信聊天里使用，直接下载切出来的表情。要上传微信表情开放平台，就在切割页补齐素材后再打包下载完整包。
