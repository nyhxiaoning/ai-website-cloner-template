            - generic [ref=f16e130]:
              - term [ref=f16e131]: 微信表情包怎么制作？
              - definition [ref=f16e132]: 在表情厨房选择风格和主题后，AI 会先生成 24 张表情合集主图，并自动切割成单张表情。聊天自用可直接下载；要上传微信平台，再按需生成横幅、封面和图标。
            - generic [ref=f16e133]:
              - term [ref=f16e134]: 上传微信表情开放平台需要哪些素材？
              - definition [ref=f16e135]: 上架需要表情单图 + 横幅、封面、图标。开通赞赏还需要赞赏引导图、致谢图，以及艺术家头像和主页横幅。表情厨房可以一站式生成全部素材。
            - generic [ref=f16e136]:
              - term [ref=f16e137]: 微信表情包尺寸是多少？
              - definition [ref=f16e138]: 单张表情为 240×240 像素，横幅为 750×400，封面为 240×240，图标为 50×50，均按微信表情开放平台常用规格生成。
            - generic [ref=f16e139]:
