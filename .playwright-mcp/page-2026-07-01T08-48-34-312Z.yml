        - heading "“世界的终极绝对本质，究竟是理念实体还是客观事物本身？”" [level=4] [ref=f1e666]
      - generic [ref=f1e667]:
        - generic [ref=f1e668]:
          - generic [ref=f1e670]: 柏拉图
          - generic [ref=f1e671]: 贤徒，你看看这世间的大理石柱。每一根石柱都会风化、残损，因为它们只是物质界的影子。唯有“石柱的理念”（Idea）在纯粹的智慧界永恒不灭，物质世界只是不完美摹本。
        - generic [ref=f1e672]:
          - generic [ref=f1e674]: 亚里士多德
          - generic [ref=f1e675]: 吾师，我敬爱您，但更爱真理。如果理念脱离了具体的石柱而单独存在，那理念就毫无用处，也无法解释万物的运动。质料与形式结合，才构成了具体的“第一实体（ousia）”！
        - generic [ref=f1e676]:
          - generic [ref=f1e678]: 柏拉图
          - generic [ref=f1e679]: 但如果灵魂不在出生前就见过那完美的绝对真善美，我们如何能在不完美的经验世界中，回忆起并辨认出哪怕一丁点的正义和圆满？
        - generic [ref=f1e680]:
          - generic [ref=f1e682]: 亚里士多德
          - generic [ref=f1e683]: 灵魂不是回忆，而是人心灵通过对多根大理石柱的经验观察，进而抽象概括出其共性形式。认识世界必须自具体的“质料”向“形式目的”演进。
