      - generic [ref=f7e766]:
        - generic [ref=f7e767]:
          - text: 公案辩题
          - heading "“世界的终极绝对本质，究竟是理念实体还是客观事物本身？”" [level=4] [ref=f7e768]
        - generic [ref=f7e769]:
          - generic [ref=f7e770]:
            - generic [ref=f7e772]: 柏拉图
            - generic [ref=f7e773]: 贤徒，你看看这世间的大理石柱。每一根石柱都会风化、残损，因为它们只是物质界的影子。唯有“石柱的理念”（Idea）在纯粹的智慧界永恒不灭，物质世界只是不完美摹本。
          - generic [ref=f7e774]:
            - generic [ref=f7e776]: 亚里士多德
            - generic [ref=f7e777]: 吾师，我敬爱您，但更爱真理。如果理念脱离了具体的石柱而单独存在，那理念就毫无用处，也无法解释万物的运动。质料与形式结合，才构成了具体的“第一实体（ousia）”！
          - generic [ref=f7e778]:
            - generic [ref=f7e780]: 柏拉图
            - generic [ref=f7e781]: 但如果灵魂不在出生前就见过那完美的绝对真善美，我们如何能在不完美的经验世界中，回忆起并辨认出哪怕一丁点的正义和圆满？
          - generic [ref=f7e782]:
            - generic [ref=f7e784]: 亚里士多德
            - generic [ref=f7e785]: 灵魂不是回忆，而是人心灵通过对多根大理石柱的经验观察，进而抽象概括出其共性形式。认识世界必须自具体的“质料”向“形式目的”演进。
        - generic [ref=f7e786]:
          - generic [ref=f7e787]: 主持：古希腊阿卡德米学院秘书处
          - generic [ref=f7e788]:
