    <title>Prompt Studio</title>
    <script>
      // 首帧前同步设好 data-theme，避免主题闪烁（FOUC）。默认 / 失败回退 dark。
      (function () {
        try {
          var pref = localStorage.getItem('prompt-studio-theme');
          if (pref !== 'dark' && pref !== 'light' && pref !== 'system') {
            pref = 'dark';
          }
          var resolved =
            pref === 'system'
              ? window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
